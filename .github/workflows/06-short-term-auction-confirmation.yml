on:
  workflow_dispatch:
    inputs:
      target_date:
        description: 目标交易日（YYYYMMDD，留空使用当天）
        required: false
        default: ''
        type: string
      snapshot_mode:
        description: 竞价数据模式；GitHub Actions 手动运行默认使用实时窗口保护
        required: true
        default: live
        type: choice
        options:
          - live
          - snapshot

permissions:
  contents: read

jobs:
  short-term-auction-confirmation:
    name: A股短线集合竞价确认
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SCREENING_ENABLED: 'true'
      SCREENING_MARKET: cn
      SHORT_TERM_AUCTION_DATE: ${{ inputs.target_date || '' }}
      SHORT_TERM_AUCTION_SNAPSHOT_MODE: ${{ inputs.snapshot_mode || 'live' }}
      LITELLM_MODEL: ${{ vars.LITELLM_MODEL || secrets.LITELLM_MODEL }}
      LITELLM_FALLBACK_MODELS: ${{ vars.LITELLM_FALLBACK_MODELS || secrets.LITELLM_FALLBACK_MODELS }}
      LITELLM_CONFIG: ${{ vars.LITELLM_CONFIG || secrets.LITELLM_CONFIG }}
      LITELLM_CONFIG_YAML: ${{ vars.LITELLM_CONFIG_YAML || secrets.LITELLM_CONFIG_YAML }}
      LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
      AGENT_LITELLM_MODEL: ${{ vars.AGENT_LITELLM_MODEL || secrets.AGENT_LITELLM_MODEL }}
      LLM_TEMPERATURE: ${{ vars.LLM_TEMPERATURE || secrets.LLM_TEMPERATURE }}
      LLM_CHANNELS: ${{ vars.LLM_CHANNELS || secrets.LLM_CHANNELS }}
      LLM_GEMINI_PROTOCOL: ${{ vars.LLM_GEMINI_PROTOCOL || secrets.LLM_GEMINI_PROTOCOL }}
      LLM_GEMINI_API_SURFACE: ${{ vars.LLM_GEMINI_API_SURFACE || secrets.LLM_GEMINI_API_SURFACE }}
      LLM_GEMINI_BASE_URL: ${{ vars.LLM_GEMINI_BASE_URL || secrets.LLM_GEMINI_BASE_URL }}
      LLM_GEMINI_API_KEY: ${{ secrets.LLM_GEMINI_API_KEY }}
      LLM_GEMINI_API_KEYS: ${{ secrets.LLM_GEMINI_API_KEYS }}
      LLM_GEMINI_MODELS: ${{ vars.LLM_GEMINI_MODELS || secrets.LLM_GEMINI_MODELS }}
      LLM_GEMINI_ENABLED: ${{ vars.LLM_GEMINI_ENABLED || secrets.LLM_GEMINI_ENABLED }}
      LLM_GEMINI_EXTRA_HEADERS: ${{ vars.LLM_GEMINI_EXTRA_HEADERS || secrets.LLM_GEMINI_EXTRA_HEADERS }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || secrets.GEMINI_MODEL || 'gemini-3-flash-preview' }}
      GEMINI_MODEL_FALLBACK: ${{ vars.GEMINI_MODEL_FALLBACK || secrets.GEMINI_MODEL_FALLBACK || 'gemini-2.5-flash' }}
      GEMINI_REQUEST_DELAY: '3.0'
      GENERATION_BACKEND: ${{ vars.GENERATION_BACKEND || secrets.GENERATION_BACKEND }}
      GENERATION_FALLBACK_BACKEND: ${{ vars.GENERATION_FALLBACK_BACKEND || secrets.GENERATION_FALLBACK_BACKEND || 'litellm' }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python 环境
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装项目依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 输出 AKShare 版本
        run: python -c "import akshare as ak; print('AKShare version:', getattr(ak, '__version__', 'unknown'))"

      - name: 生成第1阶段短线候选池
        id: candidate-pool
        continue-on-error: true
        run: python scripts/run_short_term_candidate_pool.py

      - name: 生成第2阶段市场情绪与涨停生态
        id: market-sentiment
        continue-on-error: true
        run: python scripts/run_short_term_market_sentiment.py

      - name: 生成第3阶段主线题材与龙头辨识
        id: theme-leader
        continue-on-error: true
        run: python scripts/run_short_term_theme_leader.py

      - name: 生成第4阶段弱转强观察池
        id: weak-to-strong
        continue-on-error: true
        run: python scripts/run_short_term_weak_to_strong.py

      - name: 生成第5阶段集合竞价确认
        id: auction-confirmation
        continue-on-error: true
        run: python scripts/run_short_term_auction_confirmation.py --target-date "${{ inputs.target_date || '' }}" --snapshot-mode "${{ inputs.snapshot_mode || 'live' }}"

      - name: 上传第5阶段结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-term-auction-confirmation-stage5
          path: |
            reports/short_term/auction_confirmation.json
            reports/short_term/auction_confirmation.md
            reports/short_term/candidate_pool_stage5.json
            reports/short_term/candidate_pool_stage5.md
            reports/short_term/weak_to_strong.json
            reports/short_term/weak_to_strong.md
            reports/short_term/candidate_pool_stage4.json
            reports/short_term/candidate_pool_stage4.md
          retention-days: 30
          if-no-files-found: warn

      - name: 保持前置阶段失败状态
        if: steps.candidate-pool.outcome == 'failure' || steps.market-sentiment.outcome == 'failure' || steps.theme-leader.outcome == 'failure' || steps.weak-to-strong.outcome == 'failure' || steps.auction-confirmation.outcome == 'failure'
        run: exit 1
