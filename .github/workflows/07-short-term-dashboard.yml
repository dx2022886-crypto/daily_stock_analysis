name: A股短线决策仪表盘

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - A股短线候选池
      - A股短线情绪与涨停生态
      - A股短线主线与龙头
      - A股短线弱转强观察池
      - A股短线集合竞价确认
    types: [completed]

concurrency:
  group: short-term-dashboard
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-dashboard:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: 生成静态短线决策仪表盘
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出最新 main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: 设置 Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 安装 dashboard 测试依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest anyio fastapi httpx starlette

      - name: 运行 dashboard 离线测试
        run: python -m pytest tests/test_dashboard_builder.py -q

      - name: Python 语法检查
        run: python -m py_compile dashboard/build_dashboard.py scripts/persist_stage_reports.py

      - name: 生成 dashboard 数据和页面
        run: python dashboard/build_dashboard.py

      - name: 上传 dashboard 构建结果
        uses: actions/upload-artifact@v4
        with:
          name: short-term-decision-dashboard
          path: |
            docs/index.html
            docs/dashboard_data.json
          retention-days: 30

      - name: 提交 GitHub Pages 文件
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/dashboard_data.json
          if git diff --cached --quiet; then
            echo "No dashboard changes"
            exit 0
          fi
          git commit -m "data: refresh short-term decision dashboard"
          git pull --rebase origin main
          git push origin main
