name: Stage5集合竞价烟雾测试

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage5-smoke-test:
    name: Stage5离线质量验证
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest akshare pandas exchange-calendars
          # tests/conftest.py imports these test-harness dependencies directly.
          python -m pip install anyio fastapi httpx starlette

      - name: Python语法检查
        id: syntax
        continue-on-error: true
        run: |
          python -m py_compile scripts/run_short_term_auction_confirmation.py
          python -m py_compile scripts/persist_stage5_reports.py

      - name: 检查必测用例存在
        id: required-contracts
        continue-on-error: true
        run: |
          set -euo pipefail
          test_file="tests/test_short_term_auction_confirmation.py"
          for test_name in \
            test_realtime_fetch_bypasses_cache_for_three_requests \
            test_historical_fetch_still_uses_cache \
            test_three_live_snapshots_have_unique_request_ids_and_actual_times \
            test_same_actual_time_or_cache_reuse_invalidates_late_strength \
            test_snapshot_delay_and_quality_bands_are_explicit \
            test_quote_proxy_never_gets_real_auction_fields_and_is_capped_at_b \
            test_stage5_role_priority_upgrades_stage4_theme_leader_from_stage3_market_leader; do
            grep -q "^def ${test_name}(" "$test_file"
          done
          python - <<'PY'
          from scripts import run_short_term_auction_confirmation as stage5

          assert stage5.DATA_MODE_CONFIDENCE["QUOTE_PROXY"] == 0.70
          assert stage5.GRADE_ORDER["B"] < stage5.GRADE_ORDER["C"]
          PY

      - name: 运行Stage5离线测试
        id: stage5-tests
        continue-on-error: true
        run: |
          set -o pipefail
          python -m pytest tests/test_short_term_auction_confirmation.py -q \
            --junitxml="$RUNNER_TEMP/stage5-junit.xml" \
            | tee "$RUNNER_TEMP/stage5-pytest.log"

      - name: 运行持久化离线测试
        id: persist-tests
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ -f tests/test_persist_stage5_reports.py ]; then
            set -o pipefail
            python -m pytest tests/test_persist_stage5_reports.py -q \
              --junitxml="$RUNNER_TEMP/persist-junit.xml" \
              | tee "$RUNNER_TEMP/persist-pytest.log"
          else
            echo "tests/test_persist_stage5_reports.py not present; skipped" | tee "$RUNNER_TEMP/persist-status.txt"
          fi

      - name: 写入测试摘要
        if: always()
        env:
          SYNTAX_OUTCOME: ${{ steps.syntax.outcome }}
          CONTRACT_OUTCOME: ${{ steps.required-contracts.outcome }}
          STAGE5_OUTCOME: ${{ steps.stage5-tests.outcome }}
          PERSIST_OUTCOME: ${{ steps.persist-tests.outcome }}
        run: |
          set -euo pipefail
          status_from_outcome() {
            if [ "$1" = "success" ]; then
              echo PASS
            else
              echo FAIL
            fi
          }
          syntax_status="$(status_from_outcome "$SYNTAX_OUTCOME")"
          contract_status="$(status_from_outcome "$CONTRACT_OUTCOME")"
          stage5_status="$(status_from_outcome "$STAGE5_OUTCOME")"
          persist_status="$(status_from_outcome "$PERSIST_OUTCOME")"
          if [ -f "$RUNNER_TEMP/persist-status.txt" ]; then
            persist_status="SKIPPED (file absent)"
          fi
          total_tests="$(python - "$RUNNER_TEMP/stage5-junit.xml" "$RUNNER_TEMP/persist-junit.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          total = 0
          for raw_path in sys.argv[1:]:
              path = Path(raw_path)
              if path.exists():
                  total += int(ET.parse(path).getroot().attrib.get("tests", 0))
          print(total)
          PY
          )"
          {
            echo "## Stage5 Smoke Test"
            echo
            echo "- Python syntax: ${syntax_status}"
            echo "- Required test contracts: ${contract_status}"
            echo "- Stage5 tests: ${stage5_status}"
            echo "- Persist tests: ${persist_status}"
            echo "- Total tests: ${total_tests}"
            echo "- Commit SHA: ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 汇总失败状态
        if: always()
        env:
          SYNTAX_OUTCOME: ${{ steps.syntax.outcome }}
          CONTRACT_OUTCOME: ${{ steps.required-contracts.outcome }}
          STAGE5_OUTCOME: ${{ steps.stage5-tests.outcome }}
          PERSIST_OUTCOME: ${{ steps.persist-tests.outcome }}
        run: |
          if [ "$SYNTAX_OUTCOME" != "success" ] || \
             [ "$CONTRACT_OUTCOME" != "success" ] || \
             [ "$STAGE5_OUTCOME" != "success" ] || \
             [ "$PERSIST_OUTCOME" != "success" ]; then
            echo "Stage5 smoke test failed" >&2
            exit 1
          fi
