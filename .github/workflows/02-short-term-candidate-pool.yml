name: A股短线候选池

on:
  workflow_dispatch:
    inputs:
      per_strategy_results:
        description: 每套原版模型最多返回数量
        required: true
        default: '10'
        type: string
      max_pool_results:
        description: 候选池最多输出数量
        required: true
        default: '30'
        type: string
  schedule:
    # Temporary test: 20:10 Laos = 21:10 Beijing = 13:10 UTC.
    - cron: '10 13 * * 1-5'

permissions:
  contents: write

jobs:
  short-term-candidate-pool:
    name: A股短线候选池
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SCREENING_ENABLED: 'true'
      SCREENING_MARKET: cn
      SHORT_TERM_PER_STRATEGY_RESULTS: ${{ inputs.per_strategy_results || '10' }}
      SHORT_TERM_MAX_POOL_RESULTS: ${{ inputs.max_pool_results || '30' }}
      SHORT_TERM_STAGE1_LLM_RANKING: 'true'
      SHORT_TERM_STAGE1_NEWS_ENABLED: 'false'
      SHORT_TERM_HISTORY_MAX_WORKERS: '5'
      SHORT_TERM_FAST_RETRY: 'true'
      SHORT_TERM_REALTIME_CACHE_TTL: '30'
      SHORT_TERM_SNAPSHOT_TIMEOUT: '10'
      SHORT_TERM_SNAPSHOT_SOURCE_PRIORITY: 'em_datacenter,sina,efinance,akshare_em'
      # Keep successful LLM ordering unchanged, but avoid repeated waits when
      # a provider is already unavailable; the pipeline still falls back to
      # its existing deterministic ranking path.
      LLM_MAX_RETRIES: '0'
      LITELLM_MODEL: ${{ vars.LITELLM_MODEL || secrets.LITELLM_MODEL }}
      LITELLM_FALLBACK_MODELS: ${{ vars.LITELLM_FALLBACK_MODELS || secrets.LITELLM_FALLBACK_MODELS }}
      LITELLM_CONFIG: ${{ vars.LITELLM_CONFIG || secrets.LITELLM_CONFIG }}
      LITELLM_CONFIG_YAML: ${{ vars.LITELLM_CONFIG_YAML || secrets.LITELLM_CONFIG_YAML }}
      LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
      AGENT_LITELLM_MODEL: ${{ vars.AGENT_LITELLM_MODEL || secrets.AGENT_LITELLM_MODEL }}
      LLM_TEMPERATURE: ${{ vars.LLM_TEMPERATURE || secrets.LLM_TEMPERATURE }}
      LLM_CHANNELS: ${{ vars.LLM_CHANNELS || secrets.LLM_CHANNELS }}
      LLM_GEMINI_PROTOCOL: ${{ vars.LLM_GEMINI_PROTOCOL || secrets.LLM_GEMINI_PROTOCOL }}
      LLM_GEMINI_API_SURFACE: ${{ vars.LLM_GEMINI_API_SURFACE || secrets.LLM_GEMINI_API_SURFACE }}
      LLM_GEMINI_BASE_URL: ${{ vars.LLM_GEMINI_BASE_URL || secrets.LLM_GEMINI_BASE_URL }}
      LLM_GEMINI_API_KEY: ${{ secrets.LLM_GEMINI_API_KEY }}
      LLM_GEMINI_API_KEYS: ${{ secrets.LLM_GEMINI_API_KEYS }}
      LLM_GEMINI_MODELS: ${{ vars.LLM_GEMINI_MODELS || secrets.LLM_GEMINI_MODELS }}
      LLM_GEMINI_ENABLED: ${{ vars.LLM_GEMINI_ENABLED || secrets.LLM_GEMINI_ENABLED }}
      LLM_GEMINI_EXTRA_HEADERS: ${{ vars.LLM_GEMINI_EXTRA_HEADERS || secrets.LLM_GEMINI_EXTRA_HEADERS }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || secrets.GEMINI_MODEL || 'gemini-3-flash-preview' }}
      GEMINI_MODEL_FALLBACK: ${{ vars.GEMINI_MODEL_FALLBACK || secrets.GEMINI_MODEL_FALLBACK || 'gemini-2.5-flash' }}
      GEMINI_REQUEST_DELAY: '3.0'
      GENERATION_BACKEND: ${{ vars.GENERATION_BACKEND || secrets.GENERATION_BACKEND }}
      GENERATION_FALLBACK_BACKEND: ${{ vars.GENERATION_FALLBACK_BACKEND || secrets.GENERATION_FALLBACK_BACKEND || 'litellm' }}

    steps:
      - name: 记录 Stage1 触发诊断
        run: |
          echo "event=${{ github.event_name }}"
          echo "workflow_ref=${{ github.workflow_ref }}"
          echo "sha=${{ github.sha }}"
          echo "ref=${{ github.ref }}"
          echo "utc_now=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "beijing_now=$(TZ=Asia/Shanghai date '+%Y-%m-%dT%H:%M:%S%z')"
          {
            echo "## Stage1 Schedule Diagnostic"
            echo
            echo "- Event: ${{ github.event_name }}"
            echo "- Workflow ref: ${{ github.workflow_ref }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- UTC now: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "- Beijing now: $(TZ=Asia/Shanghai date '+%Y-%m-%dT%H:%M:%S%z')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python 环境
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装项目依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-short-term.txt

      - name: 运行 A股短线候选池
        run: python scripts/run_short_term_candidate_pool.py

      - name: 输出 Stage1 性能摘要
        if: always()
        run: python scripts/profile_short_term_pipeline.py --metrics reports/short_term/performance_metrics.json || true

      - name: 写入 Stage1 性能 Summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('reports/short_term/performance_metrics.json')
          metrics = json.loads(path.read_text(encoding='utf-8')) if path.is_file() else {}
          cache = metrics.get('cache_stats') or {}
          sources = metrics.get('data_source_stats') or {}
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## Short-Term Stage1 Performance\n\n')
              summary.write('| Metric | Seconds |\n| --- | ---: |\n')
              for key, label in [('total_seconds', 'Total'), ('snapshot_fetch_seconds', 'Snapshot'), ('history_fetch_seconds', 'History'), ('realtime_quote_seconds', 'Realtime'), ('llm_rank_seconds', 'LLM'), ('news_search_seconds', 'News')]:
                  summary.write(f"| {label} | {metrics.get(key, 'N/A')} |\n")
              summary.write('\n**Cache**\n\n')
              summary.write(f"snapshot reused: {cache.get('snapshot_reused', 0)}; history hits/misses: {cache.get('history_hits', 0)}/{cache.get('history_misses', 0)}; quote hits/misses: {cache.get('quote_hits', 0)}/{cache.get('quote_misses', 0)}\n\n")
              summary.write(f"history prefetch/network/disk: {metrics.get('history_prefetch_count', 0)}/{metrics.get('history_network_fetches', 0)}/{metrics.get('history_disk_hits', 0)}; realtime HTTP/cache hits: {metrics.get('realtime_http_calls', 0)}/{metrics.get('realtime_cache_hits', 0)}\n\n")
              summary.write('**Data Sources**\n\n```json\n')
              summary.write(json.dumps(sources, ensure_ascii=False, indent=2, sort_keys=True))
              summary.write('\n```\n')
          PY

      - name: 上传短线候选池结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-term-candidate-pool
          path: |
            reports/short_term/candidate_pool.json
            reports/short_term/candidate_pool.md
            reports/short_term/performance_metrics.json
          retention-days: 30
          if-no-files-found: warn

      - name: 持久化第1阶段 latest
        run: python scripts/persist_stage_reports.py --stages stage1

      - name: 提交第1阶段 latest
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reports/short_term/latest_stage1 reports/short_term/history/stage1
          if git diff --cached --quiet; then
            echo "No Stage1 report changes"
            exit 0
          fi
          git commit -m "data: update stage1 candidate pool latest"
          git pull --rebase origin main
          git push origin main
